name: "Build, Test & Lint"

# npipe is a Windows-only package (//go:build windows) wrapping the named-pipe
# Win32 API, so every job runs on windows-latest: the toolchain and linters see
# the build-tagged files natively and the pipe tests run on the target OS.

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'LICENSE.txt'
      - 'README.md'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'LICENSE.txt'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: go.mod
          check-latest: true

      - name: Build (amd64)
        run: go build ./...

      - name: Build (386)
        env:
          GOARCH: '386'
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        # Built with the toolchain selected above so it can analyze this module's Go version.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  gosec:
    name: Security scan (gosec)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gosec
        # Run gosec with the toolchain selected above (mirrors govulncheck) so it can
        # analyze this module's Go version; the securego/gosec Docker action can ship
        # an older Go. Exclusions:
        #   G115 - integer overflow on conversion (repo-wide, matches the Merlin template)
        #   G103 - "use of unsafe calls"; this package wraps the Win32 named-pipe API, so
        #          unsafe.Pointer is intrinsic to the syscalls and cannot be removed.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude G103,G115 ./...
